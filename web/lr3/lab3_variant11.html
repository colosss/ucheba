<!DOCTYPE html>
<html>
<head>
  <title>Лабораторная работа 3 — Вариант 11</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    h2 { margin-top: 30px; }
    textarea { font-family: monospace; }
    #matrix-output { margin-top: 10px; }
    table { border-collapse: collapse; margin-top: 10px; }
    td { border: 1px solid #888; padding: 6px 10px; text-align: center; min-width: 40px; }
    .result-box { margin-top: 10px; padding: 10px; background: #f0f0f0; border-left: 4px solid #555; }
    canvas { border: 1px dashed black; display: block; margin-top: 10px; }
    button { margin: 5px 2px; padding: 6px 14px; cursor: pointer; }
    label { display: inline-block; width: 220px; }
  </style>
</head>
<body>

<h1>Вариант 11</h1>

<h2>Базовая часть</h2>
<p>В матрице найти в каждой строке наибольший элемент, а потом среди них найти наименьший (минимакс).</p>

<div>
  <label>Количество строк (n):</label>
  <input type="number" id="rows" value="4" min="1" max="20">
</div>
<div>
  <label>Количество столбцов (m):</label>
  <input type="number" id="cols" value="5" min="1" max="20">
</div>
<div style="margin-top:8px">
  <label>Диапазон случайных значений:</label>
  от <input type="number" id="rmin" value="-10" style="width:60px">
  до <input type="number" id="rmax" value="20" style="width:60px">
</div>
<button onclick="generateMatrix()">Сгенерировать матрицу</button>
<button onclick="solveMinMax()">Найти минимакс</button>

<div id="matrix-output"></div>
<div id="minimax-result" class="result-box" style="display:none"></div>

<script>
let matrix = [];

function generateMatrix() {
  const n = parseInt(document.getElementById('rows').value);
  const m = parseInt(document.getElementById('cols').value);
  const rmin = parseInt(document.getElementById('rmin').value);
  const rmax = parseInt(document.getElementById('rmax').value);

  matrix = Array.from({ length: n }, () =>
    Array.from({ length: m }, () => Math.floor(Math.random() * (rmax - rmin + 1)) + rmin)
  );

  renderMatrix();
  document.getElementById('minimax-result').style.display = 'none';
}

function renderMatrix() {
  const out = document.getElementById('matrix-output');
  let html = '<table>';
  matrix.forEach(row => {
    html += '<tr>' + row.map(v => `<td>${v}</td>`).join('') + '</tr>';
  });
  html += '</table>';
  out.innerHTML = html;
}

function solveMinMax() {
  if (matrix.length === 0) {
    alert('Сначала сгенерируйте матрицу.');
    return;
  }

  const rowMaxes = matrix.map(row => Math.max(...row));
  const minimax = Math.min(...rowMaxes);

  const resultDiv = document.getElementById('minimax-result');
  resultDiv.style.display = 'block';
  resultDiv.innerHTML =
    '<strong>Максимумы по строкам:</strong> [' + rowMaxes.join(', ') + ']<br>' +
    '<strong>Минимакс (наименьший из максимумов):</strong> ' + minimax;

  highlightMinimax(rowMaxes, minimax);
}

function highlightMinimax(rowMaxes, minimax) {
  const table = document.querySelector('#matrix-output table');
  const rows = table.querySelectorAll('tr');

  rows.forEach((tr, i) => {
    const cells = tr.querySelectorAll('td');
    cells.forEach(td => {
      td.style.background = '';
      td.style.fontWeight = '';
    });
    const maxVal = rowMaxes[i];
    cells.forEach(td => {
      if (parseInt(td.textContent) === maxVal) {
        td.style.background = maxVal === minimax ? '#f99' : '#bdf';
        td.style.fontWeight = 'bold';
      }
    });
  });
}
</script>

<hr>

<h2>Расширенная часть</h2>
<p>Ступенчатая фигура из горизонтальных отрезков: каждая следующая строка длиннее предыдущей на один отрезок.</p>

<div>
  <label>Количество ступеней (n):</label>
  <input type="number" id="steps" value="5" min="2" max="15">
</div>
<div>
  <label>Размер ячейки (пикселей):</label>
  <input type="number" id="cell" value="40" min="10" max="80">
</div>
<button onclick="drawFigure()">Нарисовать</button>
<button onclick="clearCanvas()">Очистить</button>

<canvas id="drawingCanvas" width="700" height="400"></canvas>

<script>
function clearCanvas() {
  const canvas = document.getElementById('drawingCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function drawFigure() {
  const n = parseInt(document.getElementById('steps').value);
  const cell = parseInt(document.getElementById('cell').value);
  const canvas = document.getElementById('drawingCanvas');
  const ctx = canvas.getContext('2d');

  canvas.width = (n + 1) * cell + 40;
  canvas.height = (n + 1) * cell + 40;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const ox = 20;
  const oy = 20;

  for (let i = 0; i < n; i++) {
    const segCount = i + 1;
    const y = oy + i * cell;

    ctx.beginPath();
    ctx.strokeStyle = i % 2 === 0 ? 'blue' : 'red';
    ctx.lineWidth = 2;
    ctx.moveTo(ox, y);
    ctx.lineTo(ox + segCount * cell, y);
    ctx.stroke();

    ctx.beginPath();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.moveTo(ox + segCount * cell, y);
    ctx.lineTo(ox + segCount * cell, y + cell);
    ctx.stroke();
  }

  const lastY = oy + n * cell;
  ctx.beginPath();
  ctx.strokeStyle = n % 2 === 0 ? 'blue' : 'red';
  ctx.lineWidth = 2;
  ctx.moveTo(ox, lastY);
  ctx.lineTo(ox + n * cell, lastY);
  ctx.stroke();
}
</script>

</body>
</html>
